name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docker-build-push.yaml
      - express-server/**/*
      - fastapi-server/**/*
      - next-server/**/*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        service: [next-server, express-server, fastapi-server]
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      context: ${{ matrix.service }}
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: ${{ matrix.service }}
      sbom: true
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ghcr.io/whyredfire/ls-${{ matrix.service }}
      meta-tags: |
        type=sha,format=long,prefix=
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  update-manifests:
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Update image tags
        run: |
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/whyredfire/ls-next-server:${GITHUB_SHA}\"" k8s/next-server/deployment.yaml
          yq -i "(.spec.template.spec.initContainers[0].image, .spec.template.spec.containers[0].image) = \"ghcr.io/whyredfire/ls-express-server:${GITHUB_SHA}\"" k8s/express-server/deployment.yaml
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/whyredfire/ls-fastapi-server:${GITHUB_SHA}\"" k8s/fastapi-server/deployment.yaml

      - name: Commit to repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: "k8s: Bump images to ${{ github.sha }} [no ci]"
          file_pattern: "k8s/**/deployment.yaml"
