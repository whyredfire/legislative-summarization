apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-server
spec:
  replicas: 1
  revisionHistoryLimit: 2
  template:
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/whyredfire/ls-express-server:2efffa5ad744b37df721f95a21e18144319b5bf8
          command: ["sh", "-c", "bunx prisma migrate deploy && bun run seed.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: uri
            - name: HASH_SALT
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: HASH_SALT
            - name: TEMP_USER_MAIL
              valueFrom:
                configMapKeyRef:
                  name: temp-user-config
                  key: TEMP_USER_MAIL
            - name: TEMP_USER_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: temp-user-config
                  key: TEMP_USER_PASSWORD
      containers:
        - name: express-server
          image: ghcr.io/whyredfire/ls-express-server:2efffa5ad744b37df721f95a21e18144319b5bf8
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: uri
            - name: FASTAPI_SERVER
              value: "http://fastapi-server:8000/"
            - name: HASH_SALT
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: HASH_SALT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_SECRET
            - name: OTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: OTP_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: GEMINI_API_KEY
            - name: MAIL_USER
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: MAIL_USER
            - name: MAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: MAIL_PASS
            - name: MAIL_SENDER
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: MAIL_SENDER
            - name: TEMP_USER_MAIL
              valueFrom:
                configMapKeyRef:
                  name: temp-user-config
                  key: TEMP_USER_MAIL
            - name: TEMP_USER_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: temp-user-config
                  key: TEMP_USER_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
